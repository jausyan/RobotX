/**:
  ros__parameters:
    gate_centering:
      test_mode: true
      takeoff_altitude: 2.0
      forward_distance: 3.0
      gate_width: 1.5
      centering_tolerance: 0.15
      waypoint_tolerance: 0.3
      control_mode: "velocity"
      max_velocity: 0.2
      proportional_gain: 0.5
      rotation_angle: 90.0

      detection_range_min: 4.0      
      detection_range_max: 8.0      
      roi_lateral: 3.0              
      cluster_epsilon: 0.15
      min_cluster_points: 5         
      min_pole_height: 0.5
      target_height: 0.75

    mission:
      takeoff_altitude: 15.0
      hold_time: 1.0

      use_task_1: true
      use_task_2: true
      use_task_3: false

      # geofence 
      use_geofence: true
      fence_type: 4               
      geofence_lat: [0.0]          
      geofence_lon: [0.0]

      survey_lat: [-7.2864076, -7.2863081, -7.2863818, -7.2862840] 
      survey_lon: [112.7960508, 112.7961492, 112.7960302, 112.796149]
      survey_alt: 20.0             
      survey_time: 600.0            

      # Task 2 & 3: delivery
      usv_alt: 15.0               
      approach_alt: 1.0          
      drop_alt: 2.0
      alt_step: 0.5               # fix_alt / fix_alt_range: m per step (smaller = slower, safer descend; 0 = one go)

    rangefinder_param:
      centering_alt_1: 4.0
      centering_alt_2: 1.2
      centering_alt_3: 0.8

    communication:
      order_topic: "/mission/order"                 
      usv_gps_topic: "/USV/global_position/global"
      command_timeout: 600.0                        
      run_start_timeout: 3600.0                     
      geofence_topic: "/mission/geofence"          
      geofence_timeout: 10.0                       

    vision:
      target_topic_prefix: "/vision_geo/target/"   

    centering_red:
      Ki_hold: 0.15 
      MAX_I_HOLD: 0.5 
      MAX_I_CONTRIB: 0.35 
      D_FILTER_ALPHA: 0.25
      Ki: 0.22
      kp: 1.6 
      kd: 0.28 
      min_velocity: 0.02
      speed_xy: 0.15 #0.15 
      acc: 0.20
      maxAccel: 0.7 
      X: 0.30
      Y: 0.0
      min_center_time: 0.02 
      max_center_pitch: 2.5
      max_center_roll: 2.5
      hover_pitch: 0.0
      hover_roll: 0.0
      recovery_method: "local_pose"
      centering_tolerance_first: 0.05 
      centering_tolerance_second: 0.05        
      hold_kp: 1.2
      detect_timeout: 0.4 

    servo:                         
      channel_red: 9               
      channel_green: 10
      channel_blue: 11
      servo_buka: 1200             
      servo_tutup: 270
      signal_repeat: 3
