vision_video_node:
  ros__parameters:
    input_mode: "device"
    input_source: "/dev/video2"
    model_path: "/home/robotx/RobotX/models/T1.onnx"
    input_width: 640
    input_height: 640
    letterbox: true                 # keep the aspect ratio into the model (16:9 camera -> no squashing)
    # camera device mode — C922: 1280x720 MJPG 30 fps = full sensor width (default 640x480 crops the sides)
    camera_width: 640 #1280
    camera_height: 480 #720
    camera_fourcc: "MJPG"
    camera_fps: 30
    # camera_matrix / distortion_coeffs below must match THIS mode -> run script/calibrate_camera.py
    conf_threshold: 0.4
    nms_threshold: 0.45
    use_camera_info: false
    camera_info_topic: "/iris_with_camera_2/camera/camera_info"
    # camera_matrix: [2100.26102257, 0.0, 316.54264339,
    #                 0.0, 2077.80783845, 235.75015154,
    #                 0.0, 0.0, 1.0]
    # distortion_coeffs: [-7.11619363, 85.46124509, -0.10799879, -0.10565513, -447.21970956]
    camera_matrix: [504.99132615, 0.0, 318.4012728,
                    0.0, 506.13168687, 243.99035432,
                    0.0, 0.0, 1.0]
    distortion_coeffs: [0.07771398, -0.18711237, -0.00182709, 0.00026326, -0.06212367]
    # class_names:   ["buoy_red", "buoy_blue", "circle_blue", "buoy_green", "circle_green", "buoy_black", "circle_red"]
    class_names: ['blue-light', 'green-light', 'grey-light', 'red-light']
    object_width_m: 0.3
    object_height_m: 0.3
    pose_frame_id: "camera"
    show_window: false
    window_name: "vision_video_detection"
    enable_stream: true
    stream_host: "10.7.101.218"
    stream_port: 5000
    stream_width: 640 #1280 #848
    stream_height: 480 #720 #480
    stream_fps: 15
    stream_bitrate_kbps: 2000
    stream_undistort: false         # straighten ONLY the stream (detection/GPS keep the raw image)
    stream_undistort_alpha: 1.0     # 1.0 = whole view (black curved borders), 0.0 = crop to clean rectangle
    use_openvino: true
    openvino_device: "NPU"
    openvino_model_path: ""


