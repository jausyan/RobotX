vision_video_node:
  ros__parameters:
    input_mode: "device"
    input_source: "/dev/video0"
    model_path: "/home/el-system/robotX/models/b1.onnx"
    input_width: 320
    input_height: 320
    letterbox: true                
    camera_width: 640 #1280
    camera_height: 480 #720
    camera_fourcc: "MJPG"
    camera_fps: 30
    conf_threshold: 0.4
    nms_threshold: 0.45
    use_camera_info: false
    camera_info_topic: "/iris_with_camera_2/camera/camera_info"
    # camera_matrix: [2100.26102257, 0.0, 316.54264339,
    #                 0.0, 2077.80783845, 235.75015154,
    #                 0.0, 0.0, 1.0]
    # distortion_coeffs: [-7.11619363, 85.46124509, -0.10799879, -0.10565513, -447.21970956]
    # camera_matrix: [474.11532157, 0.0, 278.72617083, 0.0, 477.53068670, 217.86543019, 0.0, 0.0, 1.0]
    # distortion_coeffs: [-0.38899220, 0.12470343, 0.00556211, 0.00572584, 0.00878730]
    # camera_matrix: [504.99132615, 0.0, 318.4012728,
    #                 0.0, 506.13168687, 243.99035432,
    #                 0.0, 0.0, 1.0]
    # distortion_coeffs: [0.07771398, -0.18711237, -0.00182709, 0.00026326, -0.06212367]
    camera_matrix: [612.23832801, 0.0, 292.50879046, 0.0, 612.89511564, 229.65043225, 0.0, 0.0, 1.0]
    distortion_coeffs: [-0.49151925, 0.36591033, 0.00508743, 0.00177489, -0.26990208]
    object_width_m: 0.3
    object_height_m: 0.3
    pose_frame_id: "camera"
    offset_x_m: 0.0                 # added to the pose [m, camera frame] — shifts the centering point
    offset_y_m: 0.0
    offset_z_m: 0.0
    crosshair_offset_y_px: 0        # moves the drawn horizontal crosshair line [px, + = down]
    show_window: false
    record_video: false             # true = save the raw camera frames (no boxes / crosshair) to record_dir
    record_dir: "video"             # relative to the folder the node is started from (workspace root)
    window_name: "vision_video_detection"
    enable_stream: true
    stream_host: "192.168.0.115"
    stream_port: 5000
    stream_width: 640 #1280 #848 
    stream_height: 480 #720 #480
    stream_fps: 15
    stream_bitrate_kbps: 2000
    stream_undistort: false         
    stream_undistort_alpha: 0.0     
    use_openvino: true
    openvino_device: "CPU"           # laptop: no NPU (drone NUC14 uses "NPU")
    openvino_model_path: ""
    class_names: ["black_buoy", "blue_buoy", "blue_circle", "green_buoy", "green_circle", "red_buoy", "red_circle"]   # index = model class id (empty = show class=<id>)

