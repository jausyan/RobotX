vision_geo_node:
  ros__parameters:
    input_mode: "topic"          # "device" | "topic"
    input_source: "/dev/video4"
    use_camera_info: false
    camera_info_topic: "/iris_with_camera_2/camera/camera_info"
    camera_matrix: [504.99132615, 0.0, 318.4012728,
                    0.0, 506.13168687, 243.99035432,
                    0.0, 0.0, 1.0]
    distortion_coeffs: [0.07771398, -0.18711237, -0.00182709, 0.00026326, -0.06212367]
    cam_to_body_rpy: [180.0, 0.0, 0.0]
    model_path: "/home/el-system/robotX/models/payload_krti_320.onnx"
    input_width: 320
    input_height: 320
    conf_threshold: 0.4
    nms_threshold: 0.45
    class_names: ["buoy"]         # one entry per YOLO class id
    gps_topic:     "/mavros/global_position/global"
    pose_topic:    "/mavros/local_position/pose"
    rel_alt_topic: "/mavros/global_position/rel_alt"
    use_fixed_pose: false
    fixed_lat: 0.0
    fixed_lon: 0.0
    fixed_altitude_m: 15.0
    max_pose_age_ms: 500
    output_topic:    "/vision_geo/detections"
    marker_topic:    "/vision_geo/markers"
    marker_frame_id: "map"
    marker_lifetime_s: 0.0        # 0 = permanent (stay until RViz closed), >0 = seconds
    marker_size: 0.8              # sphere diameter in meters
    pixel_match_radius_px: 100.0  # pixel center distance to match same buoy across consecutive frames
    track_exit_frames: 5          # missed frames before a track is committed to the map
    min_obs_to_commit: 5          # min GPS frames accumulated before committing (rejects brief detections)
    map_merge_radius_m: 2.0       # GPS merge radius — small is safe since positions are averaged over frames
    show_window: true
    window_name: "vision_geo"
