vision_geo_node:
  ros__parameters:
    input_mode: "device"          
    input_source: "/dev/video0"
    use_camera_info: false
    camera_info_topic: "/iris_with_camera_2/camera/camera_info"
    # camera_matrix: [612.23832801, 0.0, 292.50879046,
    #                 0.0, 612.89511564, 229.65043225,
    #                 0.0, 0.0, 1.0]
    # distortion_coeffs: [-0.49151925, 0.36591033, 0.00508743, 0.00177489, -0.26990208]
    camera_matrix: [612.23832801, 0.0, 292.50879046, 0.0, 612.89511564, 229.65043225, 0.0, 0.0, 1.0]
    distortion_coeffs: [-0.49151925, 0.36591033, 0.00508743, 0.00177489, -0.26990208]
    cam_to_body_rpy: [180.0, 0.0, -90.0]
    model_path: "/home/robotx/RobotX/models/raw_small.onnx"
    input_width: 640
    input_height: 640
    letterbox: true                 
    camera_width: 640
    camera_height: 480
    camera_fourcc: "MJPG"
    camera_fps: 30
    conf_threshold: 0.4
    nms_threshold: 0.45
    use_openvino: true
    openvino_device: "NPU"
    openvino_model_path: ""        
    class_names:   ["buoy_blue", "buoy_green", "buoy_red", "buoy_green", "circle_green", "circle_blue", "circle_red"]
    object_size_m: [0.4,        0.4,          0.4,         0.4,        0.65,         0.65,           0.65]  
    gps_topic:     "/rian/global_position/global"     
    pose_topic:    "/rian/local_position/pose"
    rel_alt_topic: "/rian/global_position/rel_alt"
    use_fixed_pose: false
    fixed_lat: 0.0
    fixed_lon: 0.0
    fixed_altitude_m: 15.0
    max_pose_age_ms: 500
    altitude_offset_m: 0.0        
    camera_latency_ms: 150.0      # frame age when grabbed; pose is taken from then (tune: fly a leg both ways)
    map_center_ratio: 0.7         # only detections in the central 70% of the image feed the map
    pnp_alt_check: true           # log PnP depth vs altitude (checks rel_alt / fx)
    mount_yaw_check: true         # log the cam_to_body_rpy yaw that matches the image motion
    output_topic:    "/vision_geo/detections"
    marker_topic:    "/vision_geo/markers"
    marker_frame_id: "map"
    marker_lifetime_s: 0.0        
    marker_size: 0.8              
    pixel_match_radius_px: 100.0  
    track_exit_frames: 25         # missed frames before a track is dropped (> a blink-off, ~1.5 s)
    min_obs_to_commit: 5          
    map_merge_radius_m: 2.0       
    cluster_radius_m: 3.0         # map points closer than this = SAME buoy (keep < half the buoy spacing)
    min_obs_publish: 15           # show / publish a buoy only after this many observations
    max_tilt_deg: 7.0             # skip map updates while the drone leans more than this
    obs_window: 200               # observations kept per buoy for the median position
    enable_testing: true         # true: 1st blue buoy = entry, 2nd blue buoy = exit (no blink check)
    survey_time: 10.0             # [s] map buoys this long after UAV-GO before publishing /vision_geo/map/buoy_* (Task 1 feedback)
    show_window: false
    window_name: "vision_geo"
    enable_stream: true
    stream_host: "192.168.0.115"         
    stream_port: 5000
    stream_width: 640
    stream_height: 480
    stream_fps: 15
    stream_bitrate_kbps: 2000
    stream_undistort: false         
    stream_undistort_alpha: 1.0    
    order_topic: "/mission/order"         
    wait_for_order: true                  
    target_topic_prefix: "/vision_geo/target/"   
    map_topic_prefix:    "/vision_geo/map/"      
    pose_frame_id: "camera"
