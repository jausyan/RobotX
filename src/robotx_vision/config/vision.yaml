# NOTE: write floating-point parameters with a decimal point (60.0, not 60).
vision_node:
  ros__parameters:
    topics:
      camera: /camera/image_raw
      gps: /mavros/global_position/global
      rel_alt: /mavros/global_position/rel_alt
      heading: /mavros/global_position/compass_hdg
      order: /mission/order                    # == communication.order_topic
      target_prefix: /vision_geo/target/       # == vision.target_topic_prefix
      debug_image: /vision_geo/debug_image
      publish_debug: true                      # only draws when someone subscribes
    model:
      # task1_weights: /abs/path/task1.pt      # default: <share>/robotx_vision/weights/task1.pt
      # task2_weights: /abs/path/task2.pt
      conf: 0.25
      imgsz: 640
      device: ''                               # '' = auto, or 'cuda:0' / 'cpu'
    camera:                                    # REPLACE with your real calibration
      fx: 205.47
      fy: 205.47
      cx: 320.0
      cy: 240.0
      calib_width: 640.0
      calib_height: 480.0
      yaw_offset_deg: 0.0
    geo:
      target_height_m: 0.0
      max_sensor_age_s: 1.0
    task1:
      mapping_time_s: 60.0                     # keep equal to mission.survey_time
      dist_tol_m: 3.0
      dedup_tol_m: 1.5
      blink_min_s: 0.3
      blink_max_s: 3.0
    task23:
      only_publish_ordered: false
      active_timeout_s: 0.0
    mission:
      start_index: 1
