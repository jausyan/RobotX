# NOTE: write floating-point parameters with a decimal point (60.0, not 60).
# Same output topics as vision_geo — run ONLY ONE of the two vision nodes.
vision_node:
  ros__parameters:
    topics:
      camera: /camera/image_raw
      gps: /mavros/global_position/global
      rel_alt: /mavros/global_position/rel_alt
      heading: /mavros/global_position/compass_hdg
      order: /mission/order                    # == communication.order_topic
      target_prefix: /vision_geo/target/       # PoseStamped per class == vision.target_topic_prefix
      map_prefix: /vision_geo/map/             # Task 1: buoy_red/green/entry/exit/off
      detections: /vision_geo/detections       # raw detections of each frame
      pose_frame_id: camera
      debug_image: /vision_geo/debug_image
      publish_debug: true                      # only draws when someone subscribes
    stream:                                    # GStreamer RTP/H.264 over UDP (same as vision_hailo)
      enable_stream: false
      stream_host: 192.168.0.127               # ground station IP
      stream_port: 5000
      stream_width: 640
      stream_height: 480
      stream_fps: 30
      stream_bitrate_kbps: 500
    model:
      # task1_weights: /abs/path/task1.pt      # default: <share>/robotx_vision/weights/task1.pt
      # task2_weights: /abs/path/task2.pt
      conf: 0.25
      imgsz: 640
      device: ''                               # '' = auto, or 'cuda:0' / 'cpu'
    camera:                                    # REPLACE with your real calibration
      fx: 205.47
      fy: 205.47
      cx: 320.0
      cy: 240.0
      calib_width: 640.0
      calib_height: 480.0
      yaw_offset_deg: 0.0
    geo:
      target_height_m: 0.0
      max_sensor_age_s: 1.0
    task1:
      publish_mission_done: false              # MISSION-DONE comes from the GCS (CMD_MISSION_DONE)
      mapping_time_s: 60.0                     # only used when publish_mission_done is true
      dist_tol_m: 2.0                          # same buoy if closer than this (any colour)
      dedup_tol_m: 1.5
      state_window_s: 6.0                      # light history kept per buoy
      flash_gap_min_s: 0.6                     # lit->lit gap counted as a flash (1 s on / 1 s off)
      flash_gap_max_s: 1.6
      solid_min_s: 3.0                         # blue lit this long with no off -> EXIT
    task23:
      only_publish_ordered: false
      active_timeout_s: 0.0                    # 0 = stay active until the next order
      delivery_trigger: ack                    # ack = start on control's ACK:UAV-GO:<TIN>:<CIRCLE>, order = on the order
